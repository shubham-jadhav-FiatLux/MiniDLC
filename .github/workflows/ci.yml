name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    name: C++ ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug + ASan/UBSan
            build_type: Debug
            sanitize: "ON"
          - name: Release
            build_type: Release
            sanitize: "OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev
          # LLVM 23 (headers, LLVMConfig.cmake, libLLVM, FileCheck) from apt.llvm.org
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo apt-get install -y llvm-23-dev llvm-23-tools libzstd-dev libedit-dev libcurl4-openssl-dev libxml2-dev
          pip install lit numpy pytest nanobind
      - name: Allow sanitizers with high ASLR entropy
        if: matrix.sanitize == 'ON'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=clang-23
          -DCMAKE_CXX_COMPILER=clang++-23
          -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm
          -DDLC_SANITIZE=${{ matrix.sanitize }}
          -DDLC_BUILD_PYTHON=${{ matrix.sanitize == 'ON' && 'OFF' || 'ON' }}
          -DPython_EXECUTABLE=$(which python)
          -DPython3_EXECUTABLE=$(which python)
      - name: Build
        run: cmake --build build
      - name: Test (GoogleTest, lit/FileCheck, the Python compiler and backend tests)
        run: ctest --test-dir build --output-on-failure

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install numpy pytest
      - name: Test
        run: pytest -q
