[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minidlc"
version = "0.1.0"
description = "MiniDLC: An end-to-end deep learning compiler from Python to LLVM and CUDA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Shubh" }
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["minidlc*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = "test_*.py"
